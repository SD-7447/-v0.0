<!DOCTYPE html>
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>管理后台 · S.D. 智能财务</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="topbar glass">
  <div class="brand">
    <span class="logo">S.D.</span>
    <div>
      <h1>管理后台</h1>
      <p class="sub">API 密钥 · Token 检测 · 用量统计 · 系统状态</p>
    </div>
  </div>
  <div class="top-actions">
    <span class="health" id="health">连接中…</span>
    <button class="btn" id="themeToggle">◐ 主题</button>
    <a class="btn" href="/">← 返回主界面</a>
  </div>
</header>

<main class="admin-grid">

  <!-- 识别端口与密钥 -->
  <section class="panel glass" style="grid-column:1/-1">
    <p class="section-title">识别端口与 API 密钥</p>
    <div class="form-grid">
      <div>
        <label>当前识别端口</label>
        <select id="cfgProvider">
          <option value="mock">mock（演示，无需密钥）</option>
          <option value="qwen">qwen（千问 · 视觉主力）</option>
          <option value="deepseek">deepseek（备选 · 文本复判）</option>
        </select>
      </div>
      <div>
        <label>当前生效端口</label>
        <input id="activeRecognizer" readonly>
      </div>
      <div><label>千问 API Key</label><input id="qwenKey" placeholder="sk-…（留空则保持现状）"></div>
      <div><label>千问模型</label><input id="qwenModel"></div>
      <div><label>DeepSeek API Key</label><input id="dsKey" placeholder="sk-…（留空则保持现状）"></div>
      <div><label>DeepSeek 模型</label><input id="dsModel"></div>
      <div><label>微信 Bot 令牌（BOT_TOKEN）</label><input id="botToken" placeholder="ClawBot 上传鉴权口令（留空保持不变）"></div>
      <div>
        <label>微信上传接口</label>
        <input readonly value="POST /api/bot/upload">
      </div>
    </div>
    <div class="stmt-actions">
      <button class="btn primary" id="saveConfig">💾 保存并立即生效</button>
      <button class="btn" data-test="qwen">🔍 检测千问 Key</button>
      <button class="btn" data-test="deepseek">🔍 检测 DeepSeek Key</button>
      <button class="btn" data-test="mock">🔍 检测 Mock</button>
    </div>
    <div id="testResults"></div>
  </section>

  <!-- 系统状态 -->
  <section class="panel glass">
    <p class="section-title">系统状态</p>
    <div class="kpi-row" id="kpis"></div>
    <div id="sysKv"></div>
  </section>

  <!-- Token 用量 -->
  <section class="panel glass">
    <p class="section-title">Token 用量（近 30 天）</p>
    <table class="usage-table" id="usageTable">
      <thead><tr><th>端口</th><th>调用</th><th>成功</th><th>prompt</th><th>completion</th><th>均延迟</th></tr></thead>
      <tbody></tbody>
    </table>
    <p class="section-title" style="margin-top:14px">最近调用</p>
    <table class="usage-table" id="recentTable">
      <thead><tr><th>时间</th><th>端口</th><th>模型</th><th>tokens</th><th>延迟</th><th>结果</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <!-- 操作日志 -->
  <section class="panel glass" style="grid-column:1/-1">
    <p class="section-title">操作日志</p>
    <div class="log-box" id="logBox">加载中…</div>
    <div class="stmt-actions"><button class="btn" id="refreshLogs">↻ 刷新日志</button></div>
  </section>

  <!-- 危险区 -->
  <section class="panel glass" style="grid-column:1/-1">
    <p class="section-title">危险操作</p>
    <div class="danger-zone">
      <p>清空暂存表将删除全部票据记录与修正历史（原图归档保留在 data/uploads）。此操作不可撤销。</p>
      <button class="btn danger" id="clearBtn">🗑 清空暂存表</button>
    </div>
  </section>

</main>

<footer class="foot">S.D. 智能财务 · 管理后台 · 密钥仅保存于本机 data/config.json</footer>

<script src="/static/admin.js"></script>
</body>
</html>
