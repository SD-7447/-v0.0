<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>S.D. 智能财务 · Phase 1</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="bg"></div>

<header class="topbar glass">
  <div class="brand">
    <span class="logo">S.D.</span>
    <div>
      <h1>智能财务系统</h1>
      <p class="sub">Phase 1 · 拍照 → 识别 → 暂存 → 三表 · 本地优先</p>
    </div>
  </div>
  <div class="health" id="health">连接中…</div>
</header>

<main class="layout">

  <!-- 上传区 -->
  <section class="panel glass" id="dropzone">
    <div class="dz-inner" id="dzInner">
      <div class="dz-icon">⬆</div>
      <p class="dz-title">拖入票据图片，或点击选择</p>
      <p class="dz-hint">发票 / 收据 / 银行回单 · 每传一张立即识别并更新三表</p>
      <input type="file" id="fileInput" accept="image/*" multiple hidden>
    </div>
    <ul class="feed" id="feed"></ul>
  </section>

  <!-- 三表区 -->
  <section class="panel glass">
    <div class="tabs">
      <button class="tab active" data-tab="income">利润表</button>
      <button class="tab" data-tab="balance">资产负债表</button>
      <button class="tab" data-tab="cashflow">现金流量表</button>
    </div>
    <div class="stmt-head">
      <span id="stmtMeta">—</span>
      <span id="balanceCheck" class="check"></span>
    </div>
    <table class="stmt" id="stmtTable">
      <tbody></tbody>
    </table>
  </section>

  <!-- 暂存明细区 -->
  <section class="panel glass wide">
    <div class="panel-head">
      <h2>暂存明细表 <span class="badge" id="recordCount">0</span></h2>
      <div class="filters">
        <button class="chip active" data-filter="">全部</button>
        <button class="chip" data-filter="review">待复核</button>
        <button class="chip" data-filter="ok">已入账</button>
        <button class="chip" data-filter="rejected">已拒收</button>
      </div>
    </div>
    <div class="table-wrap">
      <table class="records" id="recordsTable">
        <thead><tr>
          <th>#</th><th>时间</th><th>类型</th><th>发票号码</th><th>科目</th>
          <th>方向</th><th>价税合计</th><th>状态</th><th>备注/其他</th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

</main>

<footer class="foot">本地运行 · 数据不出本机 · S.D. 版本 v0.1（Phase 1）</footer>

<script src="/static/app.js"></script>
</body>
</html>
