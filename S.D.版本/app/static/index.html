<!DOCTYPE html>
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>S.D. 智能财务 · Phase 1</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="topbar glass">
  <div class="brand">
    <span class="logo">S.D.</span>
    <div>
      <h1>智能财务系统</h1>
      <p class="sub">Phase 1 · 拍照 → 识别 → 暂存 → 三表 · 本地优先</p>
    </div>
  </div>
  <div class="top-actions">
    <span class="health" id="health">连接中…</span>
    <button class="btn" id="themeToggle" title="切换主题">◐ 主题</button>
    <a class="btn" href="/admin">⚙ 管理后台</a>
  </div>
</header>

<main class="layout">

  <!-- 上传区 -->
  <section class="panel glass" id="dropzone">
    <div class="dz-inner" id="dzInner">
      <div class="dz-icon">⬆</div>
      <p class="dz-title">拖入票据图片，或点击选择</p>
      <p class="dz-hint">发票 / 收据 / 银行回单 · 每传一张立即识别并更新三表</p>
      <input type="file" id="fileInput" accept="image/*" multiple hidden>
    </div>
    <ul class="feed" id="feed"></ul>
  </section>

  <!-- 三表区 -->
  <section class="panel glass">
    <div class="tabs">
      <button class="tab active" data-tab="income">利润表</button>
      <button class="tab" data-tab="balance">资产负债表</button>
      <button class="tab" data-tab="cashflow">现金流量表</button>
    </div>
    <div class="stmt-head">
      <span id="stmtMeta">—</span>
      <span id="balanceCheck" class="check"></span>
    </div>
    <table class="stmt" id="stmtTable"><tbody></tbody></table>
    <div class="stmt-actions">
      <button class="btn" onclick="window.print()">🖨 打印报表</button>
      <a class="btn" href="/api/records/export?format=xlsx">⬇ 导出明细 xlsx</a>
      <a class="btn" href="/api/records/export?format=csv">⬇ csv</a>
    </div>
  </section>

  <!-- 暂存明细区 -->
  <section class="panel glass wide">
    <div class="panel-head">
      <h2>暂存明细表 <span class="badge" id="recordCount">0</span> <span class="badge warn" id="reviewBadge" style="display:none">0 待复核</span></h2>
      <div class="filters">
        <button class="chip active" data-filter="">全部</button>
        <button class="chip" data-filter="review">待复核</button>
        <button class="chip" data-filter="ok">已入账</button>
        <button class="chip" data-filter="rejected">已拒收</button>
      </div>
    </div>
    <div class="table-wrap">
      <table class="records" id="recordsTable">
        <thead><tr>
          <th>#</th><th>时间</th><th>类型</th><th>发票号码</th><th>科目</th>
          <th>方向</th><th>价税合计</th><th>状态</th><th>来源</th><th>备注/其他</th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

</main>

<!-- 人工复核窗口（G-15） -->
<div class="modal-mask" id="modalMask">
  <div class="modal glass">
    <h3 id="modalTitle">记录详情</h3>
    <p class="meta" id="modalMeta"></p>
    <div class="audit-box" id="modalAudit"></div>
    <div class="form-grid" id="modalForm"></div>
    <div class="modal-actions">
      <button class="btn" id="modalCancel">取消</button>
      <button class="btn primary" id="modalSave">保存修正并重算三表</button>
    </div>
  </div>
</div>

<footer class="foot">本地运行 · 数据不出本机 · S.D. 版本 v0.3（Phase 1 · 微信通道已接入）</footer>

<script src="/static/app.js"></script>
</body>
</html>
